<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pres Post</title>
<meta name="description" content="Make posts and reels in the headline style, in your browser. Your photos and videos never leave your device.">
<meta property="og:title" content="Pres Post">
<meta property="og:description" content="Make posts and reels in seconds. Free, in your browser.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pres Post">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap">
<style>
/* Layout: one brand bar with Posts / Reels tabs on top; each tool fills the rest of the screen in its own frame. Same Apple-style look as both tools. */
:root{
  --bg:#f2f2f7; --panel:#ffffff; --ink:#1c1c1e; --muted:#6e6e73; --line:rgba(60,60,67,.16); --well:rgba(118,118,128,.12);
  --focus:#007aff; --seg-on:#ffffff;
  --f-ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--bg:#000000; --panel:#1c1c1e; --ink:#f5f5f7; --muted:#98989f; --line:rgba(84,84,88,.55); --well:rgba(118,118,128,.24); --focus:#0a84ff; --seg-on:#636366; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.bar{flex:none;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);position:relative;z-index:2}
.bar-in{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:"Poppins",var(--f-ui);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1}
.brand svg{width:28px;height:auto;flex:none}
.tag{color:var(--muted);font-size:14px;margin:0;flex:1 1 220px;min-width:0}
.tabs{display:inline-flex;gap:2px;background:var(--well);border-radius:11px;padding:2px;margin-left:auto}
.tabs a{border-radius:9px;padding:8px 22px;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:7px;transition:background .2s,box-shadow .2s}
.tabs a svg{width:16px;height:16px;flex:none}
.tabs a[aria-selected="true"]{background:var(--seg-on);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06)}
@media (max-width:560px){.tag{display:none}.brand{font-size:22px}.tabs a{padding:7px 16px}}

.frames{flex:1;min-height:0;position:relative}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <h1 class="brand"><svg viewBox="0 0 330 335" aria-hidden="true"><defs><mask id="pmHole"><rect width="330" height="335" fill="#fff"/><rect x="58" y="55" width="217" height="153" rx="22" fill="#000"/></mask></defs><g fill="#0a84ff" mask="url(#pmHole)"><rect width="330" height="258" rx="70"/><rect y="150" width="69" height="185" rx="5"/></g><rect x="86" y="113" width="159" height="43" rx="21.5" fill="#0a84ff"/></svg>Pres Post</h1>
    <p class="tag">Make it here. Then all you gotta do is Pres Post.</p>
    <nav class="tabs" role="tablist" aria-label="Tools">
      <a href="#posts" role="tab" id="tab-posts" aria-controls="frame-posts" aria-selected="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="12" height="12" rx="2.5"/><path d="M5 6h6M5 9h4"/></svg>Posts</a>
      <a href="#reels" role="tab" id="tab-reels" aria-controls="frame-reels" aria-selected="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="1.5" width="9" height="13" rx="2"/><path d="M7 6.2v3.6L10 8z" fill="currentColor" stroke="none"/></svg>Reels</a>
    </nav>
  </div>
</header>

<main class="frames">
  <iframe id="frame-posts" title="Posts" data-src="posts.html?embed=1" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  <iframe id="frame-reels" title="Reels" data-src="reels.html?embed=1" allow="clipboard-read; clipboard-write; fullscreen; screen-wake-lock; autoplay" hidden></iframe>
</main>

<script>
// Each tool loads the first time its tab is opened and keeps its work when you switch back and forth.
const TABS = ["posts", "reels"];
function show(name){
  if (!TABS.includes(name)) name = "posts";
  for (const t of TABS) {
    const on = t === name, frame = document.getElementById("frame-" + t);
    document.getElementById("tab-" + t).setAttribute("aria-selected", on);
    frame.hidden = !on;
    if (on && !frame.src) frame.src = frame.dataset.src;
  }
  document.title = name === "reels" ? "Reels · Pres Post" : "Pres Post";
  try { localStorage.setItem("prespost:tab", name); } catch(e) {}
}
let saved = "posts";
try { saved = localStorage.getItem("prespost:tab") || "posts"; } catch(e) {}
show(location.hash.slice(1) || saved);
addEventListener("hashchange", () => show(location.hash.slice(1)));

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
