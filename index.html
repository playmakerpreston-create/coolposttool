gap:8px;flex-wrap:wrap}\n.qacts .btn{flex:1 1 auto}\n.qsrc{font-size:13px;color:var(--muted)}\n.qsrc b{color:var(--ink);font-weight:600}\n/* caption */\n.cap{width:min(100%,520px);display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}\n.cap textarea{min-height:170px;font-size:15px;line-height:1.45}\n.cap .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}\n.cap .count{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}\n.cap .count.over{color:var(--rec)}\n/* profiles */\n.empty{color:var(--muted);font-size:13px;text-align:center;padding:22px 12px;border:1.5px dashed var(--line);border-radius:14px}\n.pcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;background:var(--panel);border-radius:14px;padding:12px;cursor:pointer;transition:box-shadow .15s}\n.pcard:hover{box-shadow:0 0 0 1px var(--line)}\n.pcard.active{box-shadow:0 0 0 2px var(--focus)}\n.pav{width:44px;height:44px;border-radius:50%;background:#3a3f47;color:#c9ced6;display:grid;place-items:center;font-weight:700;overflow:hidden}\n.pav img{width:100%;height:100%;object-fit:cover}\n.pmain{display:flex;flex-direction:column;gap:4px;min-width:0}\n.pmain .ptitle{background:transparent;padding:4px 6px;margin-left:-6px;font-size:16px;font-weight:600;cursor:text}\n.pmain .ptitle:focus{background:var(--well)}\n.psub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.pacts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}\n.chip{font:500 11px var(--f-ui);background:var(--well);color:var(--muted);border-radius:6px;padding:3px 8px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n<\/head><body>\n<header class=\"top\">\n  <h1 class=\"brand\"><svg class=\"mark\" viewBox=\"0 0 330 335\" aria-hidden=\"true\"><defs><mask id=\"pmHole\"><rect width=\"330\" height=\"335\" fill=\"#fff\"/><rect x=\"58\" y=\"55\" width=\"217\" height=\"153\" rx=\"22\" fill=\"#000\"/><\/mask><\/defs><g fill=\"#0a84ff\" mask=\"url(#pmHole)\"><rect width=\"330\" height=\"258\" rx=\"70\"/><rect y=\"150\" width=\"69\" height=\"185\" rx=\"5\"/><\/g><rect x=\"86\" y=\"113\" width=\"159\" height=\"43\" rx=\"21.5\" fill=\"#0a84ff\"/><\/svg><span>Pres Post<\/span><\/h1>\n  <p>Make it here. Then all you gotta do is Pres Post.<\/p>\n<\/header>\n\n<main class=\"desk\">\n  <div class=\"controls\">\n    <div class=\"tabs\" role=\"tablist\" aria-label=\"Sections\">\n      <button role=\"tab\" data-tab=\"editor\" aria-selected=\"true\" id=\"tabBtnEditor\">Editor<\/button>\n      <button role=\"tab\" data-tab=\"profiles\" aria-selected=\"false\" id=\"tabBtnProfiles\">Profiles<\/button>\n    <\/div>\n\n    <div class=\"tabpanel\" id=\"tab-editor\">\n      <section class=\"sec\">\n        <div class=\"profrow\">\n          <label class=\"label\" for=\"profSel\">Page<\/label>\n          <select id=\"profSel\"><\/select>\n          <button class=\"btn small\" id=\"profUpdate\" title=\"Save your edits to this page profile\">Save<\/button>\n        <\/div>\n      <\/section>\n\n      <section class=\"sec\">\n        <div class=\"sec-h\"><h2>Tweet<\/h2><button class=\"btn small\" id=\"clearPost\">New post<\/button><\/div>\n        <div class=\"linkrow\">\n          <input type=\"url\" id=\"link\" placeholder=\"Paste a tweet link\" aria-label=\"Tweet link\" autocomplete=\"off\">\n          <button class=\"btn\" id=\"pasteLink\">Paste<\/button>\n          <button class=\"btn rec\" id=\"importBtn\">Make it<\/button>\n        <\/div>\n        <div class=\"detect\" id=\"detect\" hidden>\n          <span class=\"grow\" id=\"detText\">Post by <b id=\"detHandle\"><\/b><\/span>\n          <a class=\"btn small\" id=\"openPost\" href=\"#\" target=\"_blank\" rel=\"noopener\">Open post<\/a>\n          <button class=\"btn small\" id=\"addCredit\">Credit them<\/button>\n        <\/div>\n        <div class=\"field\">\n =\"text\" id=\"qName\" placeholder=\"Rockstar Games\"><\/div>\n            <div class=\"field\"><label class=\"label\" for=\"qUser\">Username<\/label><input type=\"text\" id=\"qUser\" placeholder=\"@RockstarGames\"><\/div>\n          <\/div>\n          <div class=\"field\">\n            <label class=\"label\" for=\"qText\">Quoted text<\/label>\n            <textarea id=\"qText\" rows=\"3\" placeholder=\"What the quoted tweet says\"><\/textarea>\n          <\/div>\n          <div class=\"field\">\n            <div class=\"sec-h\"><span class=\"label\">Quote photos <span id=\"qMediaCount\"><\/span><\/span>\n              <label class=\"btn small\" for=\"qMediaIn\">Add<\/label><\/div>\n            <input type=\"file\" id=\"qMediaIn\" accept=\"image/*\" multiple hidden>\n            <div class=\"thumbs\" id=\"qThumbs\"><\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"sub\" id=\"creditBody\" hidden>\n          <label class=\"label\" for=\"credit\">Credit line<\/label>\n          <input type=\"text\" id=\"credit\" placeholder=\"via @rockstargames\">\n          <span class=\"hint\">A small grey line under the post.<\/span>\n        <\/div>\n      <\/section>\n\n      <section class=\"sec\">\n        <div class=\"sec-h\"><h2>Layout<\/h2>\n          <div class=\"seg\" id=\"formatSeg\" role=\"group\" aria-label=\"Post size\"><button data-v=\"4:5\">4:5<\/button><button data-v=\"1:1\">1:1<\/button><button data-v=\"9:16\">9:16<\/button><\/div>\n        <\/div>\n        <div class=\"layouts\" id=\"layoutSeg\" role=\"group\" aria-label=\"Layout\">\n          <button data-v=\"stack\"><span class=\"mini\"><i style=\"width:90%\"><\/i><i style=\"width:65%\"><\/i><span class=\"mrow\"><b><\/b><b><\/b><\/span><\/span>Stacked<\/button>\n          <button data-v=\"side\"><span class=\"mini mside\"><span class=\"mcol\"><i><\/i><i style=\"width:80%\"><\/i><i><\/i><i style=\"width:70%\"><\/i><i><\/i><i style=\"width:85%\"><\/i><\/span><b><\/b><\/span>Text + photo<\/button>\n          <button data-v=\"cols\"><span class=\"mini\"><i style=\"width:85%\"><\/i><span class=\"mtwo\"><span class=\"mcol\"><i><\/i><i style=\"width:75%\"><\/i><i><\/i><\/span><span class=\"mcol\"><i style=\"width:80%\"><\/i><i><\/i><i style=\"width:65%\"><\/i><\/span><\/span><span class=\"mrow\"><b><\/b><b><\/b><\/span><\/span>2 columns<\/button>\n        <\/div>\n        <span class=\"hint\" id=\"layoutHint\"><\/span>\n        <div class=\"field\" id=\"sideField\" hidden>\n          <label class=\"label\" for=\"sideW\">Photo width <span id=\"sideWVal\">45%<\/span><\/label>\n          <input type=\"range\" id=\"sideW\" min=\"30\" max=\"60\" step=\"1\" value=\"45\">\n          <div class=\"sec-h\" style=\"margin-top:6px\"><label class=\"label\" for=\"sideH\">Photo height <span id=\"sideHVal\">Auto<\/span><\/label>\n            <button class=\"btn small\" id=\"sideHAuto\">Match text<\/button><\/div>\n          <input type=\"range\" id=\"sideH\" min=\"15\" max=\"100\" step=\"1\" value=\"60\">\n          <span class=\"hint\">Drag for a short or tall photo, whatever the text length.<\/span>\n        <\/div>\n      <\/section>\n\n      <details class=\"more\">\n        <summary><h2>Look<\/h2><span class=\"sum\" id=\"lookSum\"><\/span><\/summary>\n        <div class=\"more-body\">\n          <div class=\"row between\">\n            <span class=\"label\">Background<\/span>\n            <div class=\"seg\" id=\"bgSeg\" role=\"group\" aria-label=\"Background\"><button data-v=\"white\">White<\/button><button data-v=\"black\">Black<\/button><\/div>\n          <\/div>\n          <div class=\"row between\">\n            <span class=\"label\">Text size<\/span>\n            <div class=\"seg\" id=\"sizeSeg\" role=\"group\" aria-label=\"Text size\"><button data-v=\"S\">S<\/button><button data-v=\"M\">M<\/button><button data-v=\"L\">L<\/button><\/div>\n          <\/div>\n          <div class=\"row between\">\n            <span class=\"label\">Text align<\/span>\n            <div class=\"seg\" id=\"tAlignSeg\" role=\"group\" aria-label=\"Text alignment\"><button data-v=\"left\">Left<\/button><button data-v=\"center\">Center<\/button><\/div>\n          <\/div>\n          <div class=\"field\">\n            <label class=\"label\" for=\"hlWords\">Highlight words<\/label>\n            <div class=\"swatch\"><input type=\"text\" id=\"hlWords\" placeholder=\"GTA 6, Vice City\"><input type=\"color\" id=\"hlColor\" aria-label=\"Highlight color\"><\/div>\n          <\/div>\n        <\/div>\n      <\/details>\n\n      <details class=\"more\">\n        <summary><h2>Branding<\/h2><span class=\"sum\" id=\"brandSum\"><\/span><\/summary>\n        <div class=\"more-body\">\n          <label class=\"switch\"><input type=\"checkbox\" id=\"lockOn\"><i><\/i>Show my name on posts<\/label>\n          <div id=\"lockBody\" style=\"display:flex;flex-direction:column;gap:12px\">\n            <div class=\"row between\">\n              <label class=\"switch\"><input type=\"checkbox\" id=\"showAv\"><i><\/i>Profile picture<\/label>\n              <div class=\"avatar-pick\" id=\"avPick\">\n                <canvas id=\"avPrev\" width=\"104\" height=\"104\"><\/canvas>\n                <label class=\"btn small\" for=\"avIn\" id=\"avLabel\">Add photo<\/label>\n                <button class=\"btn small\" id=\"avRemove\" hidden>Remove<\/button>\n                <input type=\"file\" id=\"avIn\" accept=\"image/*\" hidden>\n              <\/div>\n            <\/div>\n            <div class=\"row\">\n              <div class=\"field\"><label class=\"label\" for=\"pName\">Name<\/label><input type=\"text\" id=\"pName\"><\/div>\n              <div class=\"field\"><label class=\"label\" for=\"pUser\">Username<\/label><input type=\"text\" id=\"pUser\"><\/div>\n            <\/div>\n            <div class=\"row between\">\n              <label class=\"switch\"><input type=\"checkbox\" id=\"pVerified\"><i><\/i>Verified badge<\/label>\n              <div class=\"seg\" id=\"alignSeg\" role=\"group\" aria-label=\"Branding alignment\"><button data-v=\"left\">Left<\/button><button data-v=\"center\">Center<\/button><\/div>\n            <\/div>\n            <div class=\"field\" id=\"badgeField\">\n              <span class=\"label\">Badge color<\/span>\n              <div class=\"badges\" id=\"badgeSeg\" role=\"group\" aria-label=\"Badge color\">\n                <button data-v=\"#1d9bf0\" style=\"background:#1d9bf0\" aria-label=\"Blue\" title=\"Blue\"><\/button>\n                <button data-v=\"#f2b705\" style=\"background:#f2b705\" aria-label=\"Gold\" title=\"Gold\"><\/button>\n                <button data-v=\"#00ba7c\" style=\"background:#00ba7c\" aria-label=\"Green\" title=\"Green\"><\/button>\n                <button data-v=\"#f4212e\" style=\"background:#f4212e\" aria-label=\"Red\" title=\"Red\"><\/button>\n                <button data-v=\"#829aab\" style=\"background:#829aab\" aria-label=\"Grey\" title=\"Grey\"><\/button>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/details>\n\n      <!-- captions are switched off; kept so saved profiles still load -->\n      <section hidden>\n        <div id=\"aiRow\"><input type=\"checkbox\" id=\"capAI\"><\/div>\n        <input type=\"checkbox\" id=\"capText\"><input type=\"checkbox\" id=\"capCredit\">\n        <input type=\"text\" id=\"capCta\"><textarea id=\"capTags\"><\/textarea>\n      <\/section>\n    <\/div>\n\n    <div class=\"tabpanel\" id=\"tab-profiles\" hidden>\n      <section class=\"sec\">\n        <div class=\"sec-h\"><h2>Save current look as a profile<\/h2><\/div>\n        <div class=\"swatch\">\n          <input type=\"text\" id=\"profTitle\" placeholder=\"e.g. Gaming page\" aria-label=\"New profile name\">\n          <button class=\"btn rec\" id=\"profSaveBtn\">Save<\/button>\n        <\/div>\n        <span class=\"hint\">Profiles are saved in this browser. Saves background, size, text size and alignment, highlight color, and your branding: photo, picture on or off, name, username and badge. Click a profile's name to rename it.<\/span>\n      <\/section>\n      <div id=\"profList\" class=\"tabpanel\"><\/div>\n    <\/div>\n  <\/div>\n\n  <section class=\"monitor\" aria-label=\"Preview\">\n    <div class=\"screen\" id=\"screen\"><canvas id=\"stage\" width=\"1080\" height=\"1350\"><\/canvas><\/div>\n    <div class=\"actions\">\n      <button class=\"btn rec\" id=\"saveBtn\"><svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11\"/><\/svg><span>Save image<\/span><\/button>\n      <button class=\"btn\" id=\"copyBtn\">Copy image<\/button>\n    <\/div>\n    <span class=\"crop-hint\" id=\"cropHint\" hidden>Tap a photo in the preview to crop, zoom or move it.<\/span>\n    <div class=\"crop\" id=\"cropBox\" hidden>\n      <div class=\"sec-h\"><span><b id=\"cropWhich\">Photo 1<\/b> \u00b7 drag it in the preview to move it<\/span>\n        <div style=\"display:flex;gap:6px\"><button class=\"btn small\" id=\"cropReset\">Reset<\/button><button class=\"btn small blue\" id=\"cropDone\">Done<\/button><\/div><\/div>\n      <div class=\"field\"><label class=\"label\" for=\"cropZoom\">Zoom <span id=\"cropZoomVal\">100%<\/span><\/label>\n        <input type=\"range\" id=\"cropZoom\" min=\"100\" max=\"400\" step=\"1\" value=\"100\"><\/div>\n      <div class=\"field\" id=\"frameField\"><label class=\"label\" for=\"frameH\">Photo frame height <span id=\"frameHVal\">100%<\/span><\/label>\n        <input type=\"range\" id=\"frameH\" min=\"50\" max=\"150\" step=\"1\" value=\"100\"><\/div>\n      <span class=\"hint\">Pinch or scroll over the photo to zoom too. The blue outline only shows here, not in your saved image.<\/span>\n    <\/div>\n    <div class=\"saved\" id=\"savedBox\" hidden>\n      <img id=\"savedImg\" alt=\"Your finished post\">\n      <span class=\"hint\">On a phone, press and hold the image to save it ange photo<\/label>\n            <button class=\"btn\" id=\"qAvRemove\" hidden>Remove<\/button>\n            <input type=\"file\" id=\"qAvIn\" accept=\"image/*\" hidden>\n          <\/div>\n          <div class=\"row\">\n            <div class=\"field\"><label class=\"label\" for=\"qName\">Name<\/label><input type=\"text\" id=\"qName\" placeholder=\"Poster's name\"><\/div>\n            <div class=\"field\"><label class=\"label\" for=\"qUser\">Username<\/label><input type=\"text\" id=\"qUser\" placeholder=\"@handle\"><\/div>\n          <\/div>\n          <label class=\"switch\"><input type=\"checkbox\" id=\"qVerified\"><i><\/i>Verified badge<\/label>\n        <\/div>\n        <span class=\"hint\">Only put a real account's name on words they actually posted.<\/span>\n        <\/div>\n\n        <div class=\"sub\" id=\"creditBody\" hidden>\n          <label class=\"label\" for=\"byline\">Credit line<\/label>\n          <input type=\"text\" id=\"byline\" placeholder=\"via @source\">\n          <div class=\"row between\">\n            <span class=\"hint\">A small grey line under the post.<\/span>\n            <div class=\"seg\" id=\"blAlignSeg\" role=\"group\" aria-label=\"Credit alignment\"><button data-v=\"left\">Left<\/button><button data-v=\"center\">Center<\/button><button data-v=\"right\">Right<\/button><\/div>\n          <\/div>\n        <\/div>\n\n        <details class=\"inline-more\">\n          <summary>No link? Paste the post's text or a screenshot<\/summary>\n          <div class=\"more-body\" style=\"padding:12px 0 0\">\n      <div class=\"row\" style=\"align-items:center;justify-content:space-between\">\n        <span class=\"label\">Fill in<\/span>\n        <div class=\"seg\" id=\"impToSeg\" role=\"group\" aria-label=\"Which post to fill in\">\n          <button data-v=\"main\">Main post<\/button><button data-v=\"quote\">Quoted post<\/button>\n        <\/div>\n      <\/div>\n      <textarea id=\"impText\" rows=\"3\" aria-label=\"Post to import\" placeholder=\"Paste a post here: select it on X, copy, then paste. The name, @handle and text fill in for you.\"><\/textarea>\n      <div class=\"qfoot\">\n        <button class=\"btn\" id=\"impPaste\">Fill from text<\/button>\n        <label class=\"btn\" for=\"impShot\" id=\"impShotBtn\" hidden>Read a screenshot<\/label>\n        <input type=\"file\" id=\"impShot\" accept=\"image/*\" hidden>\n      <\/div>\n      <span class=\"hint\" id=\"impState\">Paste a copied post, or upload a screenshot of one. Add the profile photo yourself.<\/span>\n          <\/div>\n        <\/details>\n      <\/section>\n\n      <details class=\"more\">\n        <summary><h2>Look<\/h2><span class=\"sum\" id=\"lookSum\"><\/span><\/summary>\n        <div class=\"more-body\">\n          <div class=\"row between\"><span class=\"label\">Background<\/span>\n            <div class=\"seg\" id=\"bgSeg\" role=\"group\" aria-label=\"Background\"><button data-v=\"black\">Black<\/button><button data-v=\"white\">White<\/button><\/div><\/div>\n          <div class=\"row between\"><span class=\"label\">Text weight<\/span>\n            <div class=\"seg\" id=\"hWeightSeg\" role=\"group\" aria-label=\"Headline weight\"><button data-v=\"400\">Regular<\/button><button data-v=\"700\">Bold<\/button><\/div><\/div>\n          <div class=\"row between\"><span class=\"label\">Text align<\/span>\n            <div class=\"seg\" id=\"hAlignSeg\" role=\"group\" aria-label=\"Headline alignment\"><button data-v=\"left\">Left<\/button><button data-v=\"center\">Center<\/button><button data-v=\"right\">Right<\/button><\/div><\/div>\n      <div class=\"field\">\n        <label class=\"label\" for=\"hlWords\">Highlight words<\/label>\n        <div class=\"swatch\">\n          <input type=\"text\" id=\"hlWords\" placeholder=\"e.g. AI, talk to AI\">\n          <input type=\"color\" id=\"hlColor\" aria-label=\"Highlight color\">\n        <\/div>\n        <span class=\"hint\">Separate words or phrases with commas. Matching ignores case and punctuation.<\/span>\n      <\/div>\n      <div class=\"field\">\n        <label class=\"label\" for=\"margin\">Side margin <span id=\"marginVal\"><\/span><\/label>\n        <input type=\"range\" id=\"margin\" min=\"0\" max=\"16\" step=\"1\">\n        <div class=\"row\" style=\"gap:16px\">\n          <label class=\"switch\"><input type=\"checkbox\" id=\"guides\"><i><\/i>Show margin guides<\/label>\n          <label class=\"switch\"><input type=\"checkbox\" id=\"safe\"><i><\/i>Show app safe zones<\/label>\n        <\/div>\n      <\/div>\n        <\/div>\n      <\/details>\n\n      <details class=\"more\">\n        <summary><h2>Branding<\/h2><span class=\"sum\" id=\"brandSum\"><\/span><\/summary>\n        <div class=\"more-body\">\n          <label class=\"switch\"><input type=\"checkbox\" id=\"lockOn\"><i><\/i>Show a name on posts<\/label>\n          <div class=\"lock-body\" id=\"lockBody\">\n        <div class=\"field\">\n          <span class=\"label\">Name on post<\/span>\n          <div class=\"seg\" id=\"mainWhoSeg\" role=\"group\" aria-label=\"Name on the main post\">\n            <button data-v=\"page\">My page<\/button><button data-v=\"custom\">Custom<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"lock-body\" id=\"mainCustom\" hidden>\n          <div class=\"avatar-pick\">\n            <canvas id=\"cAvPrev\" width=\"96\" height=\"96\"><\/canvas>\n            <label class=\"btn\" for=\"cAvIn\">Change photo<\/label>\n            <button class=\"btn\" id=\"cAvRemove\" hidden>Remove<\/button>\n            <input type=\"file\" id=\"cAvIn\" accept=\"image/*\" hidden>\n          <\/div>\n          <div class=\"row\">\n            <div class=\"field\"><label class=\"label\" for=\"cName\">Name<\/label><input type=\"text\" id=\"cName\" placeholder=\"Poster's name\"><\/div>\n            <div class=\"field\"><label class=\"label\" for=\"cUser\">Username<\/label><input type=\"text\" id=\"cUser\" placeholder=\"@handle\"><\/div>\n          <\/div>\n          <label class=\"switch\"><input type=\"checkbox\" id=\"cVerified\"><i><\/i>Verified badge<\/label>\n          <span class=\"hint\">Shown on this post instead of your page. Your page details below stay saved.<\/span>\n        <\/div>\n        <span class=\"label\">Your page<\/span>\n        <div class=\"avatar-pick\">\n          <canvas id=\"avPrev\" width=\"96\" height=\"96\"><\/canvas>\n          <label class=\"btn\" for=\"avIn\">Change photo<\/label>\n          <button class=\"btn\" id=\"avRemove\" hidden>Remove<\/button>\n          <input type=\"file\" id=\"avIn\" accept=\"image/*\" hidden>\n        <\/div>\n        <div class=\"row\">\n          <div class=\"field\"><label class=\"label\" for=\"pName\">Name<\/label><input type=\"text\" id=\"pName\"><\/div>\n          <div class=\"field\"><label class=\"label\" for=\"pUser\">Username<\/label><input type=\"text\" id=\"pUser\"><\/div>\n        <\/div>\n        <div class=\"row\" style=\"justify-content:space-between;align-items:center\">\n          <label class=\"switch\"><input type=\"checkbox\" id=\"pVerified\"><i><\/i>Verified badge<\/label>\n          <div class=\"seg\" id=\"alignSeg\" role=\"group\" aria-label=\"Lockup alignment\">\n            <button data-v=\"left\">Left<\/button><button data-v=\"center\">Center<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"field\" id=\"badgeField\">\n          <span class=\"label\">Badge color<\/span>\n          <div class=\"badges\" id=\"badgeSeg\" role=\"group\" aria-label=\"Badge color\">\n            <button data-v=\"#1d9bf0\" style=\"background:#1d9bf0\" aria-label=\"Blue\" title=\"Blue\"><\/button>\n            <button data-v=\"#f2b705\" style=\"background:#f2b705\" aria-label=\"Yellow\" title=\"Yellow\"><\/button>\n            <button data-v=\"#00ba7c\" style=\"background:#00ba7c\" aria-label=\"Green\" title=\"Green\"><\/button>\n            <button data-v=\"#f4212e\" style=\"background:#f4212e\" aria-label=\"Red\" title=\"Red\"><\/button>\n            <button data-v=\"#ffffff\" style=\"background:#ffffff\" aria-label=\"White\" title=\"White\"><\/button>\n          <\/div>\n        <\/div>\n          <\/div>\n        <\/div>\n      <\/details>\n    <\/div>\n\n    <div class=\"tabpanel\" id=\"tab-profiles\" hidden>\n      <section class=\"sec\">\n        <div class=\"sec-h\"><h2>Save current look as a profile<\/h2><\/div>\n        <div class=\"swatch\">\n          <input type=\"text\" id=\"profTitle\" placeholder=\"e.g. Evidence of Aliens\" aria-label=\"New profile name\">\n          <button class=\"btn rec\" id=\"profSaveBtn\">Save<\/button>\n        <\/div>\n        <span class=\"hint\">Saves the background, headline size and alignment, highlight color, frame, side margin, profile lockup (photo, name, username, badge) and byline. Click a profile's name to rename it.<\/span>\n      <\/section>\n      <div id=\"profList\" class=\"tabpanel\"><\/div>\n    <\/div>\n\n    <div class=\"tabpanel\" id=\"tab-queue\" hidden>\n      <section class=\"sec\">\n        <div class=\"sec-h\"><h2>Queue<\/h2><\/div>\n        <span class=\"hint\">Build a reel in the Editor and press Add to queue. Repeat for each reel, then export them all in one go. Queued videos only live in this tab, so export before you close the page.<\/span>\n        <div class=\"qfoot\">\n          <button class=\"btn rec\" id=\"qExport\"><svg viewBox=\"0 0 16 16\" fill=\"currentColor\"><circle cx=\"8\" cy=\"8\" r=\"5\"/><\/svg><span>Export all<\/span><\/button>\n          <button class=\"btn\" id=\"qZip\" hidden>Save as .zip<\/button>\n          <button class=\"btn\" id=\"qClear\" hidden>Clear exported<\/button>\n        <\/div>\n      <\/section>\n      <div id=\"qList\" class=\"tabpanel\"><\/div>\n    <\/div>\n\n    <div class=\"tabpanel\" id=\"tab-ai\" hidden>\n      <section class=\"sec\">\n        <div class=\"sec-h\"><h2>AI ideas<\/h2><span class=\"opt\">Beta<\/span><\/div>\n        <div class=\"field\"><label class=\"label\" for=\"aiPage      <div class=\"qfoot\"><button class=\"btn rec\" id=\"rwGo\">Write headlines<\/button><button class=\"btn\" id=\"rwStop\" hidden>Stop<\/button><\/div>\n        <span class=\"hint\" id=\"rwState\">Type it however it comes to you. You'll get headlines built to stop the scroll. Click one to send it to the editor.<\/span>\n      <\/section>\n      <div id=\"rwOut\" class=\"tabpanel\"><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Monitor -->\n  <section class=\"monitor\" aria-label=\"Preview\">\n    <div class=\"screen\">\n      <canvas id=\"stage\" width=\"1080\" height=\"1920\"><\/canvas>\n      <div class=\"guides\" id=\"guideBox\"><span id=\"gL\"><\/span><span id=\"gR\"><\/span><\/div>\n      <div class=\"cutbadge\" id=\"cutBadge\" hidden>Trimmed out \u00b7 not in export<\/div>\n      <!-- preview-only overlay: areas the reels app covers with its own buttons and text; never recorded -->\n      <svg class=\"safezones\" id=\"safeBox\" viewBox=\"0 0 1080 1920\" preserveAspectRatio=\"none\" hidden aria-hidden=\"true\">\n        <path fill=\"#ff5a5f\" fill-opacity=\".38\" fill-rule=\"evenodd\" d=\"M0 0H1080V1920H0Z M140 107H1032V1128H890V1728H803V1601H48V230H140Z\"/>\n        <g fill=\"#7a2f33\" fill-opacity=\".28\">\n          <rect x=\"169\" y=\"37\" width=\"90\" height=\"40\"/><rect x=\"759\" y=\"45\" width=\"215\" height=\"43\"/><rect x=\"90\" y=\"156\" width=\"32\" height=\"47\"/>\n          <rect x=\"919\" y=\"1157\" width=\"72\" height=\"72\"/><rect x=\"919\" y=\"1253\" width=\"72\" height=\"34\"/>\n          <rect x=\"919\" y=\"1338\" width=\"72\" height=\"72\"/><rect x=\"919\" y=\"1430\" width=\"72\" height=\"34\"/>\n          <rect x=\"919\" y=\"1521\" width=\"72\" height=\"72\"/><rect x=\"919\" y=\"1613\" width=\"72\" height=\"34\"/>\n          <rect x=\"923\" y=\"1712\" width=\"62\" height=\"30\"/><rect x=\"911\" y=\"1798\" width=\"90\" height=\"90\"/>\n          <rect x=\"85\" y=\"1617\" width=\"112\" height=\"112\"/><rect x=\"208\" y=\"1625\" width=\"317\" height=\"47\"/><rect x=\"208\" y=\"1677\" width=\"400\" height=\"35\"/>\n          <rect x=\"621\" y=\"1638\" width=\"162\" height=\"71\"/><rect x=\"79\" y=\"1756\" width=\"756\" height=\"42\"/><rect x=\"81\" y=\"1829\" width=\"400\" height=\"42\"/>\n        <\/g>\n      <\/svg>\n      <div class=\"recbadge\" id=\"recBadge\" hidden><i><\/i>REC<\/div>\n    <\/div>\n\n    <div class=\"scrub\">\n      <span class=\"mono\" id=\"tNow\">0:00.0<\/span>\n      <input type=\"range\" id=\"seek\" min=\"0\" max=\"1000\" value=\"0\" aria-label=\"Seek\" class=\"grow\">\n      <span class=\"mono\" id=\"tDur\">0:00.0<\/span>\n    <\/div>\n\n    <div class=\"transport\">\n      <button class=\"btn\" id=\"playBtn\"><svg viewBox=\"0 0 16 16\" fill=\"currentColor\"><path d=\"M4 2.5v11l9-5.5z\"/><\/svg><span>Play<\/span><\/button>\n      <button class=\"btn\" id=\"muteBtn\" aria-pressed=\"false\"><svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M2.5 6h2.5l3.5-3v10l-3.5-3h-2.5z\" fill=\"currentColor\" stroke=\"none\"/><path id=\"muteWave\" d=\"M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4\"/><\/svg><span>Sound on<\/span><\/button>\n      <button class=\"btn\" id=\"queueBtn\"><svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M2 4h9M2 8h9M2 12h5M12.5 9v5M10 11.5h5\"/><\/svg><span>Add to queue<\/span><\/button>\n      <button class=\"btn rec\" id=\"exportBtn\"><svg viewBox=\"0 0 16 16\" fill=\"currentColor\"><circle cx=\"8\" cy=\"8\" r=\"5\"/><\/svg><span>Export reel<\/span><\/button>\n    <\/div>\n\n    <div class=\"export\" id=\"trimBox\" hidden>\n      <div class=\"sec-h\">\n        <span class=\"label\">Trim \u00b7 <span id=\"trimVal\"><\/span><\/span>\n        <button class=\"btn small\" id=\"trimReset\">Reset<\/button>\n      <\/div>\n      <div class=\"trim-acts\" id=\"trimActs\">\n        <button class=\"btn\" id=\"setIn\">Trim start here<\/button>\n        <button class=\"btn\" id=\"setOut\">Trim end here<\/button>\n      <\/div>\n      <span class=\"hint\" id=\"trimHint\" hidden>Pause where you want to cut.<\/span>\n      <div class=\"trim\">\n        <div class=\"trim-sel\" id=\"trimSel\"><\/div>\n        <div class=\"trim-head\" id=\"trimHead\"><\/div>\n        <input type=\"range\" id=\"trimA\" min=\"0\" max=\"1000\" value=\"0\" aria-label=\"Trim start\">\n        <input type=\"range\" id=\"trimB\" min=\"0\" max=\"1000\" value=\"1000\" aria-label=\"Trim end\">\n      <\/div>\n      <div class=\"sec-h\"><span class=\"mono\" id=\"trimAT\">0:00.0<\/span><span class=\"mono\" id=\"trimBT\">0:00.0<\/span><\/div>\n    <\/div>\n\n    <div class=\"export\" id=\"qualityRow\">\n      <div class=\"sec-h\">\n        <span class=\"label\">Export quality<\/span>\n        <div class=\"seg\" id=\"qualitySeg\" role=\"group\" aria-label=\"Export quality\">\n          <button data-v=\"1080\">1080p<\/button><button data-v=\"1440\">1440p<\/button><button data-v=\"2160\">4K<\/button>\n        <\/div>\n      <\/div>\n      <span class=\"hint\" id=\"qualityHint\"><\/span>\n    <\/div>\n\n    <div class=\"export\">\n      <div class=\"xp\" id=\"xp\" hidden>\n        <div class=\"xp-top\"><span class=\"xp-dot\"><\/span><span class=\"xp-title\">Exporting reel<\/span><span id=\"xpPct\">0%<\/span><\/div>\n        <div class=\"bar\"><div id=\"barFill\"><\/div><\/div>\n        <div class=\"xp-bot\"><span class=\"mono\" id=\"xpTime\">0:00.0 of 0:00.0<\/span><span class=\"mono\" id=\"xpLeft\"><\/span><\/div>\n        <button class=\"btn\" id=\"cancelBtn\">Cancel export<\/button>\n      <\/div>\n      <div class=\"result\" id=\"result\" hidden>\n        <canvas id=\"resThumb\" width=\"108\" height=\"192\"><\/canvas>\n        <div class=\"grow\">\n          <div class=\"res-title\"><i><\/i>Reel ready<\/div>\n          <div class=\"chips\" id=\"resultText\"><\/div>\n        <\/div>\n        <button class=\"btn rec\" id=\"saveBtn\">Save<\/button>\n      <\/
